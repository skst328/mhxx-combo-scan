[package]
name = "combo-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MHXX の調合動画から乱数位置を特定する解析エンジン"

[lib]
# rlib はテストから lib をリンクするのに要る
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.128"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", features = ["js"] }

[build-dependencies]
png = "0.18.1"

[dev-dependencies]
png = "0.18.1"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
